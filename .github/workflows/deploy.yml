name: Deploy to GitHub Pages

# 手動実行のみ。
# Pagesの配信元を「GitHub Actions」に切り替えたときだけ使う。
# 「ブランチから配信」の設定のまま自動実行すると毎回失敗し、
# エラー通知が届いてしまうため、pushトリガーは意図的に外してある。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない（あとから押したデプロイを優先する）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Babelをインストール
        run: npm install --no-save @babel/core@^7.24.0 @babel/preset-react@^7.24.0

      - name: JSXを事前変換してdist/を作る
        run: node build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
