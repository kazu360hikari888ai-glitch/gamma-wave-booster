            constructor() {

                this.oscR = null;
                this.cameraNoiseNode = null; // For pink/brown noise

                this.envFileElement = null; // <audio>要素
                this._envFileBlobUrl = null; // Blobから生成したObject URL（廃棄用）
                this._currentEnvVol = undefined; // 音量保持用

                // フェードアウト中の破棄予約（再生を押し直したらキャンセルする）
                this._fadeTimer = null;
                this._envFadeTimer = null;
            }

            init() {
                // フェードアウト中に再開された場合は、破棄予約を取り消して既存のctxを使い回す
                this.cancelPendingFade();
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();

                    // Master Gain (Binaural)
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.connect(this.ctx.destination);

                    // Environment Gain (Noise)
                    this.envGain = this.ctx.createGain();
                    this.envGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // AudioContextがsuspendedになった場合に再開する（バックグラウンド復帰時用）
            ensureContextRunning() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});

                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                // If oscillators exist and are running, update frequency smoothly
                if (this.oscL && this.oscR) {
                    try {
                        this.oscL.frequency.setTargetAtTime(carrier, now, 0.1);
                        this.oscR.frequency.setTargetAtTime(carrier + diff, now, 0.1);
                        return;
                    } catch (e) {
                        // Fallback if stale
                    }
                }

                // Create new oscillators (First run or after stop)
                // Left
                this.oscL = this.ctx.createOscillator();
                this.oscL.type = 'sine';
                this.oscL.frequency.setValueAtTime(carrier, now);
                const panL = this.ctx.createStereoPanner();
                panL.pan.value = -1;
                this.oscL.connect(panL).connect(this.masterGain);

                // Right
                this.oscR = this.ctx.createOscillator();
                this.oscR.type = 'sine';
                this.oscR.frequency.setValueAtTime(carrier + diff, now);
                const panR = this.ctx.createStereoPanner();
                panR.pan.value = 1;
                this.oscR.connect(panR).connect(this.masterGain);

                this.oscL.start();
                this.oscR.start();
            }

            startNoise(type = 'pink') {
                if (!this.ctx) return;
                this.stopNoise();

                const bufferSize = 2 * this.ctx.sampleRate;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);

                // Generate Pink Noise
                if (type === 'pink') {
                    let b0, b1, b2, b3, b4, b5, b6;
                    b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
                    // [MEDIUM-5修正] Math.random() → crypto.getRandomValues() へ変更
                    const randBuf = new Uint32Array(bufferSize);
                    crypto.getRandomValues(randBuf);
                    for (let i = 0; i < bufferSize; i++) {
                        const white = (randBuf[i] / 0xFFFFFFFF) * 2 - 1;
                        b0 = 0.99886 * b0 + white * 0.0555179;
                        b1 = 0.99332 * b1 + white * 0.0750759;
                        b2 = 0.96900 * b2 + white * 0.1538520;
                        b3 = 0.86650 * b3 + white * 0.3104856;
                        b4 = 0.55000 * b4 + white * 0.5329522;
                        b5 = -0.7616 * b5 - white * 0.0168980;
                        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                        output[i] *= 0.11; // (roughly) compensate for gain
                        b6 = white * 0.115926;
                    }
                }
                // Generate Brown Noise
                else {
                    let lastOut = 0.0;
                    // [MEDIUM-5修正] Math.random() → crypto.getRandomValues() へ変更
                    const randBuf2 = new Uint32Array(bufferSize);
                    crypto.getRandomValues(randBuf2);
                    for (let i = 0; i < bufferSize; i++) {
                        const white = (randBuf2[i] / 0xFFFFFFFF) * 2 - 1;
                        output[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = output[i];
                        output[i] *= 3.5; // (roughly) compensate for gain
                    }
                }

                this.cameraNoiseNode = this.ctx.createBufferSource();
                this.cameraNoiseNode.buffer = buffer;
                this.cameraNoiseNode.loop = true;
                this.cameraNoiseNode.connect(this.envGain);
                this.cameraNoiseNode.start();
            }

            stopNoise() {
                if (this.cameraNoiseNode) {
                    try {
                        this.cameraNoiseNode.stop();
                    } catch (e) { }
                    this.cameraNoiseNode.disconnect();
                    this.cameraNoiseNode = null;
                }
            }

            // ─── 環境音ファイル: HTMLMediaElement独立再生方式 ───
            // AudioContextへのルーティング(createMediaElementSource)を行うと
            // 特にAndroid Chromeの仕様により、バックグラウンド時にOSがメディアフォーカスを外してしまうことがある。
            // これを防ぐため、環境音は完全に独立した<audio>タグ上で再生し、
            // 脳波誘導(AudioContext)と「同時並行で」再生させる。
            playEnvFile(source) {
                this.stopEnvFile();
                if (!source) return;

                try {
                    // BlobURLに変換（Blob/Fileの場合）
                    let blobUrl;
                    if (source instanceof Blob) {
                        blobUrl = URL.createObjectURL(source);
                        this._envFileBlobUrl = blobUrl; // 将来のrevokeObjectURL用
                    } else {
                        blobUrl = source;
                        this._envFileBlobUrl = null;
                    }

                    // <video>要素をオーディオ代わりに使用する（モバイルバックグラウンド再生に最も強固）
                    // こうすることでモバイルOSが「アクティブなメディア再生」とみなしやすくなる
                    const audio = document.createElement('video');
                    audio.src = blobUrl;
                    audio.loop = true;
                    audio.playsInline = true; // iOS/Androidバックグラウンド向け必須

                    // DOMへの確実な追加（メディアセッションに維持させるために必須）
                    audio.style.display = 'none';
                    document.body.appendChild(audio);

                    // --- バックグラウンド移行時などOSの強制停止(pause)に抵抗して即座に再開させるハック ---
                    audio.addEventListener('pause', () => {
                        // this.envFileElementが設定し直されていない/破棄されていないのにpauseされたなら、OSの強制遮断
                        if (this.envFileElement === audio && audio.src) {
                            audio.play().catch(e => console.warn('background auto-play prevented', e));
                        }
                    });

                    // 最新の環境音ボリュームを適用
                    audio.volume = (this._currentEnvVol !== undefined ? this._currentEnvVol : 50) / 100;

                    // 再生開始（ユーザージェスチャーコンテキスト内のためiOSでも有効）
                    audio.play().catch(e => console.error('環境音play error:', e));

                    this.envFileElement = audio;
                } catch (e) {
                    console.error('playEnvFile error:', e);
                }
            }

            stopEnvFile() {
                if (this.envFileElement) {
                    try {
                        this.envFileElement.pause();
                        this.envFileElement.src = '';
                        this.envFileElement.remove(); // DOMから削除
                    } catch (e) { }
                    this.envFileElement = null;
                }
                if (this._envFileBlobUrl) {
                    URL.revokeObjectURL(this._envFileBlobUrl);
                    this._envFileBlobUrl = null;
                }
            }

            // 破棄予約と環境音フェードのタイマーを取り消す
            cancelPendingFade() {
                if (this._fadeTimer) { clearTimeout(this._fadeTimer); this._fadeTimer = null; }
                if (this._envFadeTimer) { clearInterval(this._envFadeTimer); this._envFadeTimer = null; }
            }

            // セッション終了時に音をいきなり切らず、フェードアウトしてから破棄する。
            // 開始時は3秒のフェードインがあるのに終了が即時だと、
            // 特に安眠・鎮痛モードで音がブツッと切れて眠りを妨げるため。
            fadeOutAndCleanup(seconds = 3) {
                if (!this.ctx) { this.cleanup(); return; }
                this.cancelPendingFade();

                const now = this.ctx.currentTime;
                const rampToZero = (param) => {
                    try {
                        param.cancelScheduledValues(now);
                        param.setValueAtTime(param.value, now);
                        // linearRampToValueAtTime は 0 ちょうどを嫌うので極小値へ
                        param.linearRampToValueAtTime(0.0001, now + seconds);
                    } catch (e) { }
                };
                if (this.masterGain) rampToZero(this.masterGain.gain);
                if (this.envGain) rampToZero(this.envGain.gain);

                // 環境音ファイルはAudioContextの外（<video>要素）で鳴っているので個別にフェードする
                const el = this.envFileElement;
                if (el) {
                    const startVol = el.volume;
                    const stepMs = 50;
                    const steps = Math.max(1, Math.round((seconds * 1000) / stepMs));
                    let i = 0;
                    this._envFadeTimer = setInterval(() => {
                        i++;
                        try { el.volume = Math.max(0, startVol * (1 - i / steps)); } catch (e) { }
                        if (i >= steps) { clearInterval(this._envFadeTimer); this._envFadeTimer = null; }
                    }, stepMs);
                }

                this._fadeTimer = setTimeout(() => {
                    this._fadeTimer = null;
                    this.cleanup();
                }, seconds * 1000 + 150);
            }

            cleanup() {
                this.cancelPendingFade();
                if (this.oscL) {
                    try { this.oscL.stop(); } catch (e) { }
                    try { this.oscL.disconnect(); } catch (e) { }
                    this.oscL = null;
                }
                if (this.oscR) {
                    try { this.oscR.stop(); } catch (e) { }
                    try { this.oscR.disconnect(); } catch (e) { }
                    this.oscR = null;
                }
                this.stopNoise();
                this.stopEnvFile(); // 環境音ファイルも停止
                if (this.ctx) {
                    this.ctx.close().catch(e => console.error(e));
                    this.ctx = null;
                }
            }

            setVolumes(masterVol, envVol, fade = false) {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                this._currentEnvVol = envVol; // playEnvFile時の初期音量用

                // Volume Scaling
                const normMaster = masterVol / 100;
                const actualMaster = Math.pow(normMaster, 2) * 0.1;

                // Master Gain
                if (this.masterGain) {
                    if (fade) {
                        try {
                            // フェードアウト途中で再開された場合、残っている予約を消してから上げ直す
                            this.masterGain.gain.cancelScheduledValues(now);
                            this.masterGain.gain.setValueAtTime(0, now);
                            this.masterGain.gain.linearRampToValueAtTime(actualMaster, now + 3);
                        } catch (e) { }
                    } else {
                        if (masterVol <= 0) {
                            try {
                                this.masterGain.gain.cancelScheduledValues(now);
                                this.masterGain.gain.setTargetAtTime(0, now, 0.1);
                            } catch (e) { }
                        } else {
                            try { this.masterGain.gain.setTargetAtTime(actualMaster, now, 0.5); } catch (e) { }
                        }
                    }
                }

                // Env Gain
                if (this.envGain) {
                    try { this.envGain.gain.cancelScheduledValues(now); } catch (e) { }
                    if (envVol <= 0) {
                        try { this.envGain.gain.setTargetAtTime(0, now, 0.1); } catch (e) { }
                    } else {
                        try { this.envGain.gain.setTargetAtTime(envVol / 100, now, 0.5); } catch (e) { }
                    }
                }

                // 環境音要素(HTMLMediaElement)の直接音量制御
                if (this.envFileElement) {
                    this.envFileElement.volume = envVol / 100;
                }
            }
        } // end class AudioManager

        const LOG_KEY = 'gamma_session_log';
        const LOG_LIMIT = 500; // 古いものから捨てる上限

        const SessionLog = {
            load() {
                try {
                    const raw = localStorage.getItem(LOG_KEY);
                    if (!raw) return [];
                    const arr = JSON.parse(raw);
                    if (!Array.isArray(arr)) return [];
                    // 壊れた行が混ざっていても全体を巻き込まないよう取り除く
                    return arr.filter(r => r && typeof r === 'object' && r.startedAt);
                } catch (e) {
                    console.error('記録の読み込みに失敗しました:', e);
                    return [];
                }
            },
            save(list) {
                const trimmed = list.slice(-LOG_LIMIT);
                try {
                    localStorage.setItem(LOG_KEY, JSON.stringify(trimmed));
                } catch (e) {
                    console.error('記録の保存に失敗しました:', e);
                }
                return trimmed;
            },
            add(entry) { return SessionLog.save(SessionLog.load().concat([entry])); },
            remove(id) { return SessionLog.save(SessionLog.load().filter(r => r.id !== id)); },
            clear() {
                try { localStorage.removeItem(LOG_KEY); } catch (e) { }
                return [];
            },
        };

        // モード別の平均改善度。痛みを前後とも記録したセッションだけを対象にする。
        const summarizeByMode = (list) => {
            const scored = list.filter(r =>
                typeof r.painBefore === 'number' && typeof r.painAfter === 'number');
            const byMode = {};
            scored.forEach(r => {
                if (!byMode[r.modeId]) {
                    byMode[r.modeId] = { modeId: r.modeId, label: r.modeLabel, n: 0, before: 0, after: 0 };
                }
                const m = byMode[r.modeId];
                m.n += 1;
                m.before += r.painBefore;
                m.after += r.painAfter;
            });
            return Object.keys(byMode).map(k => {
                const m = byMode[k];
                return {
                    modeId: m.modeId, label: m.label, n: m.n,
                    avgBefore: m.before / m.n,
                    avgAfter: m.after / m.n,
                    avgDelta: (m.before - m.after) / m.n,
                };
            }).sort((a, b) => b.avgDelta - a.avgDelta);

        // --- IndexedDB: 環境音ファイルの永続化 ---
        // localStorageはファイル（Blobバイナリ）を保存できないため、IndexedDBを使用する
        const AudioFileDB = (() => {
            const DB_NAME = 'GammaBoosterAudio';
            const STORE = 'envFiles';
            const VERSION = 1;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, VERSION);
                    req.onupgradeneeded = e => {
                        e.target.result.createObjectStore(STORE);
                    };
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = e => reject(e.target.error);
                });
            }

            async function withDB(mode, fn) {
                const db = await openDB();
                try {
                    return await new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE, mode);
                        tx.onerror = e => reject(e.target.error);
                        fn(tx.objectStore(STORE), resolve, reject);
                    });
                } finally {
                    db.close();
                }
            }

            return {
                // Blob + ファイル名を保存
                save(key, blob, name) {
                    return withDB('readwrite', (store, resolve, reject) => {
                        const req = store.put({ blob, name }, key);
                        req.onsuccess = resolve;
                        req.onerror = e => reject(e.target.error);
                    }).catch(e => console.error('AudioFileDB.save:', e));
                },
                // 1エントリブ読み込み
                load(key) {
                    return withDB('readonly', (store, resolve, reject) => {
                        const req = store.get(key);
                        req.onsuccess = e => resolve(e.target.result || null);
                        req.onerror = e => reject(e.target.error);
                    }).catch(e => { console.error('AudioFileDB.load:', e); return null; });
                },
                // 複数エントリを一括読み込み
                async loadAll(keys) {
                    const results = {};
                    await Promise.all(keys.map(async key => {
                        results[key] = await this.load(key);
                    }));
                    return results;
                },
                // エントリ削除
                delete(key) {
                    return withDB('readwrite', (store, resolve, reject) => {
                        const req = store.delete(key);
                        req.onsuccess = resolve;
                        req.onerror = e => reject(e.target.error);
                    }).catch(e => console.error('AudioFileDB.delete:', e));
                },
            };
        })();

        // --- Breathing Guide Component ---
        // フェーズ判定は Date.now() 基準（既存タイマーと同方式）。
        // setInterval が遅延・停止してもズレが蓄積しない。
        const BreathingGuide = ({ pattern, active, accentColor }) => {
            const [now, setNow] = useState(Date.now());
            const startRef = useRef(Date.now());
            const patternId = pattern ? pattern.id : null;

            // 再生開始・パターン変更でサイクルを先頭に戻す
            useEffect(() => {
                startRef.current = Date.now();
                setNow(Date.now());
            }, [active, patternId]);

            useEffect(() => {
                if (!active || !patternId) return;
                const id = setInterval(() => setNow(Date.now()), 200);
                return () => clearInterval(id);
            }, [active, patternId]);

            if (!active || !pattern) return null;

            const cycleSec = pattern.phases.reduce((s, p) => s + p.sec, 0);
            const t = ((now - startRef.current) / 1000) % cycleSec;
            let acc = 0;
            let phase = pattern.phases[0];
            let remain = pattern.phases[0].sec;
            for (let i = 0; i < pattern.phases.length; i++) {
                const p = pattern.phases[i];
                if (t < acc + p.sec) { phase = p; remain = acc + p.sec - t; break; }
                acc += p.sec;
            }
            const color = accentColor || pattern.color;

            return (
                <div className="w-full flex items-center gap-3 rounded-xl px-3 py-2.5"
                    style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)' }}>
                    <div className="relative shrink-0" style={{ width: '56px', height: '56px' }}>
                        <div className="absolute inset-0 rounded-full" style={{ border: `1px dashed ${color}40` }}></div>
                        <div className="absolute inset-0 rounded-full"
                            style={{
                                background: `radial-gradient(circle, ${color}cc 0%, ${color}33 70%, transparent 100%)`,
                                transform: `scale(${phase.to})`,
                                transition: `transform ${phase.sec}s ease-in-out`
                            }}></div>
                        <div className="absolute inset-0 flex items-center justify-center font-mono text-sm text-white/90">
                            {Math.ceil(remain)}
                        </div>
                    </div>
                    <div className="min-w-0">
                        <div className="text-sm font-semibold leading-tight" style={{ color }}>{phase.t}</div>
                        <div className="text-[10px] text-white/40 truncate mt-0.5">
                            🫁 {pattern.label}（{pattern.ratio}）
                        </div>
                    </div>
                </div>
            );
        };

            // Timer State for Auto Mode

            // 一時停止中（経過時間を保持したまま音だけ止めている状態）
            const [isPaused, setIsPaused] = useState(false);
            // セッション記録
            const [sessionLog, setSessionLog] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [painBefore, setPainBefore] = useState(null); // 未入力は null
            const [pendingLog, setPendingLog] = useState(null); // 終了モーダルに渡す途中の記録
            const sessionMetaRef = useRef(null);                // 開始時のモード・設定を保持

            const [duration, setDuration] = useState(3600); // seconds (default 60m)

            // Audio Manager
            const audioMgr = useRef(new AudioManager());

            // --- Security: 値のサニタイズヘルパー ---
            const sanitizeNumber = (val, min, max, defaultVal) => {
                const num = Number(val);
                if (isNaN(num) || !isFinite(num)) return defaultVal;
                return Math.max(min, Math.min(max, Math.round(num)));
            };

            const sanitizeString = (val, allowed, defaultVal) => {
                if (typeof val !== 'string') return defaultVal;
                return allowed.includes(val) ? val : defaultVal;
            };

            const allowedEnvIds = ENV_OPTIONS.map(e => e.id);
            const allowedModeIds = MODES.map(m => m.id);
            const allowedBreathIds = ['off', 'auto'].concat(BREATH_PATTERNS.map(p => p.id));
            const allowedDurations = [600, 1200, 1800, 3600, 5400];

            // ロード完了フラグ（初回保存の競合防止）
            const loadCompleteRef = useRef(false);
            // 最新の設定を常に保持するRef（pagehideなど非同期外からでも最新値を取得できる）
            const currentConfigRef = useRef(null);

            // Init & Load Settings
            useEffect(() => {

                // Load Config
                const savedConfig = localStorage.getItem('gamma_config');
                let restoredOk = false;
                if (savedConfig) {
                    try {
                        const config = JSON.parse(savedConfig);
                        if (typeof config !== 'object' || config === null) throw new Error('Invalid config');

                        if (config.masterVol !== undefined) setMasterVol(sanitizeNumber(config.masterVol, 0, 100, 20));
                        if (config.envVol !== undefined) setEnvVol(sanitizeNumber(config.envVol, 0, 100, 20));

                        if (config.duration) {
                            const dur = sanitizeNumber(config.duration, 60, 7200, 3600);
                            setDuration(dur);
                        }
                        if (config.selectedEnv) {
                            // Migrate old 'local' to 'custom1'
                            let env = config.selectedEnv === 'local' ? 'custom1' : config.selectedEnv;
                            env = sanitizeString(env, allowedEnvIds, 'none');
                            setSelectedEnv(env);
                        }

                        if (config.breathId) {
                            setBreathId(sanitizeString(config.breathId, allowedBreathIds, 'auto'));
                        }

                        if (config.currentModeId) {
                            const safeId = sanitizeString(config.currentModeId, allowedModeIds, null);
                            if (safeId) {
                                const found = MODES.find(m => m.id === safeId);
                                if (found) setCurrentMode(found);
                            }
                        }
                        restoredOk = true;
                    } catch (e) {
                        console.error('設定の読み込みに失敗しました:', e);
                    }
                }

                // ロード完了フラグON → 以降の state 変化で自動保存が動く
                // 復元成功時は「前回の設定を復元しました」トーストを表示
                requestAnimationFrame(() => {
                    loadCompleteRef.current = true;

                // ─── IndexedDBから環境音ファイルを次の起動時に自動復元 ───
                const ENV_KEYS = ['stream', 'ocean', 'custom1', 'custom2', 'custom3', 'custom4', 'custom5'];
                AudioFileDB.loadAll(ENV_KEYS).then(savedFiles => {
                    const restored = {};
                    for (const [key, data] of Object.entries(savedFiles)) {
                        if (data && data.blob) {
                            // Blobから再生可能なObject URLを生成
                            const url = URL.createObjectURL(data.blob);
                            // fileプロパティにBlobを保持（playEnvFileがBlob直接アクセスできる）
                            restored[key] = { url, name: data.name, file: data.blob };
                        }
                    }
                    if (Object.keys(restored).length > 0) {
                        setEnvFiles(prev => ({ ...prev, ...restored }));
                    }
                }).catch(e => console.error('AudioFileDB restore error:', e));

                // ─── アプリ終了・バックグラウンド時の確実な保存 ───
                // iOS PWA では beforeunload が発火しないため pagehide + visibilitychange を使用
                const saveNow = () => {
                    if (currentConfigRef.current) {
                        try {
                            localStorage.setItem('gamma_config', JSON.stringify(currentConfigRef.current));
                        } catch (e) { /* QuotaExceededError 等は無視 */ }
                    }
                };

                const handlePageHide = () => saveNow();
                const handleBeforeUnload = () => saveNow();
                const handleVisibilityForSave = () => {
                    if (document.hidden) saveNow();
                };

                window.addEventListener('pagehide', handlePageHide);
                window.addEventListener('beforeunload', handleBeforeUnload);
                document.addEventListener('visibilitychange', handleVisibilityForSave);

                return () => {
                    saveNow(); // アンマウント時にも念のため保存
                    if (timerRef.current) clearInterval(timerRef.current);
                    if (bgKeepAliveRef.current) clearInterval(bgKeepAliveRef.current);
                    audioMgr.current.cleanup();
                    mediaMgr.current.stop();
                    window.removeEventListener('pagehide', handlePageHide);
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                    document.removeEventListener('visibilitychange', handleVisibilityForSave);
                };
            }, []);



            // Handle Play/Pause
            // 再生中に押すと「一時停止」（経過時間を保持）。停止したい場合は停止ボタンを使う。
            const togglePlay = () => {
                if (isPlaying) {
                    pauseSession();
                    return;

                setIsPlaying(true);

            const startSession = (resumeFrom = 0) => {

                if (resumeFrom === 0) {

                        startedAt: new Date().toISOString(),
                        modeId: currentMode.id,

                isPlayingRef.current = true; // ref同期（バックグラウンド用）
                window.__gammaIsPlaying = true; // グローバルフラグ（visibilitychange用）
                updateFrequency(resumeFrom); // Start oscillators

                // Fade in master volume
                audioMgr.current.setVolumes(masterVol, envVol, true);

                // Start Environment Sound
                updateEnvironmentSound();

                // --- バックグラウンド再生の維持 ---
                // MediaSession APIでOSメディアコントロール対応
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: currentMode.label,
                        artist: '脳波ブースター Pro',
                        album: 'Gamma Wave Booster',
                    });
                    navigator.mediaSession.setActionHandler('pause', () => pauseSession());
                    navigator.mediaSession.setActionHandler('play', () => { });
                }

                // Wake Lock APIでスクリーンオフ防止
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').then(lock => {
                        wakeLockRef.current = lock;
                    }).catch(e => console.log('Wake Lock取得失敗:', e));
                }

                // --- バックグラウンドkeepAlive ---
                // モバイルブラウザはバックグラウンドでsetIntervalを大幅にスロットリングする。
                // AudioContextの状態を定期的にチェックし、suspendedなら再開する。
                if (bgKeepAliveRef.current) clearInterval(bgKeepAliveRef.current);
                bgKeepAliveRef.current = setInterval(() => {
                    if (!isPlayingRef.current) return;

                    audioMgr.current.ensureContextRunning();
                    // 環境音が止まっていたら再開
                    if (audioMgr.current.envFileElement) {

                        if (el.paused && el.src) {

                    }

                setElapsed(resumeFrom);

                if (timerRef.current) clearInterval(timerRef.current);

                    if (!sessionStartRef.current) return;
                    const next = Math.floor((Date.now() - sessionStartRef.current) / 1000);
                    setElapsed(next);

            // セッションの終了処理。

                if (!pause) {

            const [selectedGroup, setSelectedGroup] = useState(MODE_GROUPS[0].id);

            // 実際に表示する呼吸パターン（'auto' のときはモードから自動選択）
            const breathPattern = resolveBreathPattern(breathId, currentMode.id);

            // Get modes for the currently selected group (plain calculation, not useMemo)
            const currentGroupModes = (() => {
                const group = MODE_GROUPS.find(g => g.id === selectedGroup);
                return group ? group.modes : MODE_GROUPS[0].modes;
            })();

            // Auto-sync group tab when mode changes (e.g. from config restore)
            useEffect(() => {
                const ownerGroup = MODE_GROUPS.find(g => g.modes.some(m => m.id === currentMode.id));
                if (ownerGroup && ownerGroup.id !== selectedGroup) {
                    setSelectedGroup(ownerGroup.id);
                }
            }, [currentMode.id]);

            return (
                <div className="relative min-h-screen flex flex-col items-center justify-center p-4">

                    {/* Background Aura - Primary */}
                    <div
                        className="aura w-96 h-96 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 transition-colors duration-1000"
                        style={{ backgroundColor: isPlaying ? currentMode.color : '#334155' }}
                    ></div>
                    {/* Background Aura - Secondary (offset for depth) */}
                    <div
                        className="aura-secondary w-80 h-80 top-[40%] left-[55%] -translate-x-1/2 -translate-y-1/2 transition-colors duration-[2000ms]"
                        style={{ backgroundColor: isPlaying ? currentMode.color : '#1e293b', opacity: 0.3 }}
                    ></div>

                    {/* Glass Container */}
                    <div className="glass-panel relative w-full max-w-md rounded-3xl p-6 z-10 flex flex-col gap-5">

                        {/* Header */}
                        <header className="flex justify-between items-center">
                            <div>
                                <h1 className="text-lg font-bold tracking-tight text-white/90">
                                    🧠 脳波ブースター
                                </h1>
                                <p className="text-[10px] text-white/30 tracking-wider">Gamma Wave Booster Pro</p>
                            </div>
                            <div className="flex items-center gap-1">
                                <button onClick={() => setShowHistory(true)}
                                    aria-label="セッション記録を開く" title="記録"
                                    className="p-2 rounded-full hover:bg-white/10 transition-colors text-white/70">
                                    <IconHistory />
                                </button>
                                <button onClick={() => setShowSettings(!showSettings)}
                                    aria-label="設定を開く" title="設定"
                                    className="p-2 rounded-full hover:bg-white/10 transition-colors">
                                    <IconSettings />
                                </button>
                            </div>
                        </header>

                        {/* Timer Display */}
                        <div className="flex flex-col items-center justify-center py-3">
                            <div className="relative">
                                <div className="text-6xl font-mono font-thin tracking-wider text-white">
                                    {(isPlaying || isPaused) ? formatTime(Math.max(0, duration - elapsed)) : formatTime(duration)}
                                </div>
                                {isPlaying && (
                                    <div className="absolute -inset-4 rounded-full border border-white/10 pulse-ring pointer-events-none"></div>
                                )}
                            </div>

                            {/* Duration Selectors（再生中・一時停止中は変更させない） */}
                            {!isPlaying && !isPaused && (
                                <div className="flex flex-col items-center mt-4 w-full">
                                    <span className="text-[10px] uppercase text-white/40 tracking-widest mb-2">時間設定</span>
                                    <div className="flex gap-2">
                                        {[10, 20, 30, 60, 90].map(m => (
                                            <button
                                                key={m}
                                                onClick={() => setDuration(m * 60)}
                                                aria-label={`セッション時間を${m}分にする`}
                                                aria-pressed={duration === m * 60}
                                                className={`text-sm px-3 py-1.5 rounded-lg border transition-all duration-300 ${duration === m * 60
                                                    ? 'bg-white text-black font-bold border-white shadow-[0_0_20px_rgba(255,255,255,0.2)]'
                                                    : 'border-white/15 text-white/50 hover:bg-white/10 hover:text-white hover:border-white/30'
                                                    }`}
                                            >
                                                {m}分
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Current Mode Label */}
                            <div className="text-sm font-semibold tracking-wide pt-3" style={{ color: currentMode.color }}>
                                {currentMode.label}
                                {currentMode.flow && <span className="badge-flow">フロー</span>}
                            </div>
                            <div className="text-xs text-white/30 mt-0.5">
                                {getFreqLabel()}
                            </div>
                        </div>

                        {/* Breathing Guide (再生中のみ) */}
                        {isPlaying && breathPattern && (
                            <BreathingGuide pattern={breathPattern} active={isPlaying} accentColor={currentMode.color} />
                        )}

                        {/* Mode Info Panel - Always visible for selected mode */}
                        <div className="mode-info rounded-xl p-3 text-xs text-white/70 leading-relaxed">
                            <div className="flex items-start gap-2">
                                <span className="text-base mt-0.5" style={{ color: currentMode.color }}>●</span>
                                <span>{getModeDetail(currentMode.id)}</span>
                            </div>
                        </div>

                        {/* Group Selector */}
                        <div>
                            <label className="text-[10px] uppercase text-white/40 tracking-widest mb-2 block">カテゴリ</label>
                            <div className="group-tabs">
                                {MODE_GROUPS.map(group => (
                                    <button
                                        key={group.id}
                                        onClick={() => setSelectedGroup(group.id)}
                                        aria-pressed={selectedGroup === group.id}
                                        className={`group-tab ${selectedGroup === group.id ? 'active' : ''}`}
                                        style={selectedGroup === group.id ? { borderColor: group.color + '60', boxShadow: `0 2px 12px ${group.color}20` } : {}}
                                    >
                                        {group.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Mode Selector (filtered by group) */}
                        <div>
                            <label className="text-[10px] uppercase text-white/40 tracking-widest mb-2 block">モード選択</label>
                            <div className="grid grid-cols-1 gap-1.5 max-h-40 overflow-y-auto pr-1">
                                {currentGroupModes.map(mode => (
                                    <button
                                        key={mode.id}
                                        onClick={() => setCurrentMode(mode)}
                                        className={`p-2.5 rounded-xl text-left transition-all duration-200 border ${currentMode.id === mode.id
                                            ? 'bg-white/10 border-white/30 shadow-lg shadow-black/20'
                                            : 'border-transparent hover:bg-white/5 text-white/60 hover:border-white/10'
                                            }`}
                                    >
                                        <div className="flex items-center gap-1.5">
                                            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: mode.color }}></span>
                                            <span className="text-xs font-semibold" style={{ color: currentMode.id === mode.id ? mode.color : undefined }}>{mode.label}</span>
                                            {mode.flow && <span className="badge-flow">フロー</span>}
                                        </div>
                                        <div className="text-[10px] text-white/35 mt-0.5 pl-3.5">{mode.desc}</div>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Environmental Sound Selector */}
                        <div className="flex flex-col gap-2">
                            <div className="flex items-center justify-between">
                                <label className="text-[10px] uppercase text-white/40 tracking-widest">環境音</label>
                                <span className="text-[9px] text-white/25">※ バックグラウンド再生対応</span>
                            </div>
                            <div className="grid grid-cols-4 gap-1.5">
                                {ENV_OPTIONS.map(opt => {
                                    const isBuiltIn = (opt.id === 'stream' || opt.id === 'ocean');
                                    const isCustom = opt.id.startsWith('custom');
                                    const fileInfo = envFiles[opt.id];
                                    const hasFile = fileInfo && fileInfo.name;
                                    const customLabel = hasFile ? fileInfo.name.replace(/\.[^.]+$/, '').slice(0, 8) : opt.label;
                                    const isDisabled = (isCustom || isBuiltIn) && !hasFile && opt.id !== 'none';
                                    return (
                                        <button
                                            key={opt.id}
                                            onClick={() => !isDisabled && setSelectedEnv(opt.id)}
                                            aria-label={`環境音: ${hasFile ? fileInfo.name : opt.label}`}
                                            aria-pressed={selectedEnv === opt.id}
                                            aria-disabled={isDisabled}
                                            className={`py-1.5 px-1 rounded-lg text-[10px] font-medium border transition-all duration-200 truncate ${selectedEnv === opt.id
                                                ? 'bg-white/10 border-white/25 text-white shadow-sm'
                                                : isDisabled
                                                    ? 'border-white/5 text-white/15 cursor-default'
                                                    : 'border-white/5 text-white/35 hover:bg-white/5 hover:text-white/60'
                                                }`}
                                            title={hasFile ? envFiles[opt.id].name : opt.label}
                                        >
                                            {opt.id === 'none' ? opt.label : (hasFile ? `🎵 ${customLabel}` : `${opt.label}`)}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Breathing Guide Selector */}
                        <div>
                            <div className="flex justify-between items-center mb-2">
                                <label className="text-[10px] uppercase text-white/40 tracking-widest">呼吸ガイド</label>
                                <span className="text-[9px] text-white/25">※ 再生中に表示されます</span>
                            </div>
                            <div className="grid grid-cols-3 gap-1.5">
                                {BREATH_OPTIONS.map(opt => (
                                    <button
                                        key={opt.id}
                                        onClick={() => setBreathId(opt.id)}
                                        aria-label={`呼吸ガイド: ${opt.label}`}
                                        aria-pressed={breathId === opt.id}
                                        className={`py-1.5 px-1 rounded-lg text-[10px] font-medium border transition-all duration-200 truncate ${breathId === opt.id
                                            ? 'bg-white/10 border-white/25 text-white shadow-sm'
                                            : 'border-white/5 text-white/35 hover:bg-white/5 hover:text-white/60'
                                            }`}
                                    >
                                        {opt.label}
                                    </button>
                                ))}
                            </div>
                            {breathPattern && (
                                <p className="text-[10px] text-white/35 leading-relaxed mt-2">
                                    {breathId === 'auto' && <span className="text-white/50">{breathPattern.label}（{breathPattern.ratio}）… </span>}
                                    {breathPattern.desc}
                                </p>
                            )}
                        </div>

                        {/* Volume Mixers */}
                        <div className="space-y-3">
                            <div>
                                <div className="flex justify-between text-[10px] text-white/50 mb-1">
                                    <span>🎧 脳波誘導 音量</span>
                                    <span className="font-mono">{masterVol}%</span>
                                </div>
                                <input
                                    type="range" min="0" max="100"
                                    aria-label="脳波誘導の音量"
                                    value={masterVol}
                                    onChange={(e) => setMasterVol(Number(e.target.value))}
                                    className="w-full"
                                />
                            </div>
                            <div>
                                <div className="flex justify-between text-[10px] text-white/50 mb-1">
                                    <span>🌿 環境音 音量</span>
                                    <span className="font-mono">{envVol}%</span>
                                </div>
                                <input
                                    type="range" min="0" max="100"
                                    aria-label="環境音の音量"
                                    value={envVol}
                                    onChange={(e) => setEnvVol(Number(e.target.value))}
                                    className="w-full"
                                />
                            </div>
                        </div>

                        {/* 開始前のつらさ入力（記録用・任意） */}
                        {!isPlaying && !isPaused && (
                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <label className="text-[10px] uppercase text-white/40 tracking-widest">いまのつらさ</label>
                                    <span className="text-[9px] text-white/25">※ 任意・記録用</span>
                                </div>
                                <PainScale value={painBefore} onChange={setPainBefore} allowNone={true} />
                                <p className="text-[10px] text-white/30 leading-relaxed mt-2">
                                    入力してから始めると、終了後に変化を記録できます（「—」は記録しない）。
                                </p>
                            </div>
                        )}

                        {/* Main Action Button */}
                        <div className="flex justify-center items-center gap-4 pt-1 pb-2">
                            <div className="relative">
                                {isPlaying && (
                                    <div className="absolute inset-0 rounded-full pulse-ring" style={{ borderColor: currentMode.color, borderWidth: '2px', borderStyle: 'solid' }}></div>
                                )}
                                <button
                                    onClick={togglePlay}
                                    aria-label={isPlaying ? '一時停止' : (isPaused ? '続きから再開' : '再生')}
                                    className={`relative btn-glow p-5 rounded-full transition-all duration-500 transform hover:scale-105 active:scale-95 ${isPlaying ? 'text-white' : 'bg-white/10 text-white'
                                        }`}
                                    style={{
                                        boxShadow: isPlaying ? `0 0 40px ${currentMode.color}50, inset 0 0 20px ${currentMode.color}20` : '0 0 20px rgba(255,255,255,0.05)',
                                        border: `2px solid ${isPlaying ? currentMode.color : 'rgba(255,255,255,0.1)'}`,
                                        background: isPlaying ? `radial-gradient(circle, ${currentMode.color}30 0%, transparent 70%)` : undefined
                                    }}
                                >
                                    {isPlaying ? <IconPause /> : <IconPlay />}
                                </button>
                            </div>

                            {/* 停止（経過時間をリセット）。再生中・一時停止中のみ表示 */}
                            {(isPlaying || isPaused) && (
                                <button
                                    onClick={stopSession}
                                    aria-label="停止して最初に戻す"
                                    title="停止して最初に戻す"
                                    className="p-3 rounded-full border border-white/15 text-white/50 hover:text-white hover:bg-white/10 hover:border-white/30 transition-all duration-300 active:scale-95"
                                >
                                    <IconStop />
                                </button>
                            )}
                        </div>

                        {isPaused && (
                            <p className="text-center text-[11px] text-white/45 -mt-3">
                                一時停止中 — 再生ボタンで続きから再開します
                            </p>
                        )}
                    </div>

                    {/* Save Toast */}
                    {toastMsg && (
                        <div className="save-toast">
                            <div className="px-5 py-2.5 rounded-full text-sm font-semibold text-white shadow-2xl"
                                style={{ background: 'linear-gradient(135deg, rgba(16,185,129,0.9) 0%, rgba(6,182,212,0.9) 100%)', backdropFilter: 'blur(12px)', border: '1px solid rgba(255,255,255,0.2)' }}>
                                {toastMsg}
                            </div>
                        </div>
                    )}

                    {/* Settings Modal (Portal) */}
                    <SettingsModal
                        show={showSettings}
                        onClose={() => setShowSettings(false)}
                        envFiles={envFiles}
                        setEnvFiles={setEnvFiles}
                        onExport={exportSettings}
                        onImport={importSettings}
                        customFolderFiles={customFolderFiles}
                        setCustomFolderFiles={setCustomFolderFiles}
                    />



                    {/* セッション記録 */}
                    <SessionEndModal
                        pending={pendingLog}
                        onSave={saveSessionLog}
                        onSkip={skipSessionLog}
                    />
                    <HistoryModal
                        show={showHistory}
                        onClose={() => setShowHistory(false)}
                        log={sessionLog}
                        setLog={setSessionLog}
                    />

                    {/* Debug Console (Hidden by default, toggle with 'D') */}
                    <DebugConsole />
                </div>
            );
        }

        // --- バックグラウンド再生維持: visibilitychange対策 ---
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // ページが非表示になった時: メディア要素の再生を維持
                const contexts = document.querySelectorAll('video, audio');
                contexts.forEach(el => {
                    if (el.paused && el.dataset.wasPlaying === 'true') {
                        el.play().catch(() => { });
                    }
                });
            } else {
                // ページが再表示された時: AudioContextとWake Lockを復旧
                // 一時停止されたメディア要素を再生
                const mediaElements = document.querySelectorAll('video, audio');
                mediaElements.forEach(el => {
                    if (el.paused && el.dataset.wasPlaying === 'true') {
                        el.play().catch(() => { });
                    }
                });

                // Wake Lockの再取得（ページが再表示されるとWake Lockは自動解放される）
                // window.__gammaIsPlaying はReact内のstartSession/stopSessionで管理
                if ('wakeLock' in navigator && window.__gammaIsPlaying) {
                    navigator.wakeLock.request('screen').catch(() => { });
                }
            }
        });

        // メディア要素の再生状態をトラッキング
        document.addEventListener('play', (e) => {
            if (e.target.tagName === 'VIDEO' || e.target.tagName === 'AUDIO') {
                e.target.dataset.wasPlaying = 'true';
            }
        }, true);

        document.addEventListener('pause', (e) => {
            if (e.target.tagName === 'VIDEO' || e.target.tagName === 'AUDIO') {
                // ユーザーが意図的に停止した場合のみフラグを消す
                if (!document.hidden) {
                    e.target.dataset.wasPlaying = 'false';
                }
            }
        }, true);

        // --- Debug Console Component ---
        // [LOW-6修正] デバッグコンソールをlocalhost開発環境に限定し、本番アプリでは表示しない
        const IS_DEV = window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.protocol === 'file:';

        const DebugConsole = () => {
            // 本番環境では完全に非表示
            if (!IS_DEV) return null;

            const [visible, setVisible] = useState(false);
            const [logs, setLogs] = useState([]);

            useEffect(() => {
                const handler = (e) => {
                    if (e.key === 'd' || e.key === 'D') setVisible(prev => !prev);
                };
                window.addEventListener('keydown', handler);

                const updateLogs = () => setLogs([...debugLogs]);
                window.addEventListener('debug-update', updateLogs);

                return () => {
                    window.removeEventListener('keydown', handler);
                    window.removeEventListener('debug-update', updateLogs);
                };
            }, []);

            if (!visible) return <div className="fixed bottom-0 right-0 p-2 text-xs text-white/20 cursor-pointer" onClick={() => setVisible(true)}>Debug (Press 'D')</div>;

            return (
                <div className="fixed bottom-0 left-0 right-0 h-48 bg-black/90 text-green-400 font-mono text-xs overflow-y-auto p-2 z-[10000] border-t border-white/20">
                    <div className="flex justify-between mb-1 sticky top-0 bg-black/90">
                        <span>Debug Console</span>
                        <button onClick={() => setVisible(false)}>X</button>
                    </div>
                    {logs.map((l, i) => <div key={i}>{l}</div>)}
                </div>
            );
        };

        // --- Error Boundary for debugging ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ errorInfo });
                console.error('React Error Boundary caught:', error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return React.createElement('div', {
                        style: { padding: '40px', background: '#1a0000', color: '#ff6b6b', minHeight: '100vh', fontFamily: 'monospace' }
                    },
                        React.createElement('h1', null, '⚠️ アプリケーションエラー'),
                        React.createElement('pre', { style: { whiteSpace: 'pre-wrap', fontSize: '14px', marginTop: '20px', color: '#ffaaaa' } },
                            this.state.error && this.state.error.toString()
                        ),
                        React.createElement('pre', { style: { whiteSpace: 'pre-wrap', fontSize: '12px', marginTop: '10px', color: '#ff8888' } },
                            this.state.errorInfo && this.state.errorInfo.componentStack
                        ),
                        React.createElement('button', {
                            onClick: () => { localStorage.removeItem('gamma_config'); window.location.reload(); },
                            style: { marginTop: '20px', padding: '10px 20px', background: '#ff4444', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '14px' }
                        }, '🔄 設定をリセットして再読み込み')
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>

    <!-- Service Worker 登録 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>

</body>

</html>
